{% extends "base.html" %}
{% load static %}


{% block content %}


<div class="error-404-page">

    <h1 class="error-404-title">
        Oops! Something went wrong with your request.
    </h1>

    <img
        src="{% static 'img/errors/400.png' %}"
        alt="400 - Bad Request"
        class="error-404-image"
    >

    <p class="error-404-description">
        The server couldn't understand your request. Please try again.
    </p>

    <a href="{% url 'website:index' %}" class="error-404-button">
        Back to Home
    </a>

</div>


{% endblock %}
