{% extends "base.html" %}
{% load static %}


{% block content %}


<div class="error-404-page">

    <h1 class="error-404-title">
        The page you are looking for can't be found.
    </h1>

    <img
        src="{% static 'img/errors/404.png' %}"
        alt="404 - Page Not Found"
        class="error-404-image"
    >

    <p class="error-404-description">
        Oops! Looks like you've wandered into the unknown.
    </p>

    <a href="{% url 'website:index' %}" class="error-404-button">
        Back to Home
    </a>

</div>


{% endblock %}
