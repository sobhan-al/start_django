{% extends "base.html" %}
{% load static %}

{% block content %}


<div class="error-404-page">

    <br>
    <br>
    <br>
    <br>
    <br>
    
    <h1 class="error-404-title">
        Something went wrong on our end.
    </h1>

    <img
        src="{% static 'img/errors/500.png' %}"
        alt="500 - Internal Server Error"
        class="error-404-image"
    >

    <p class="error-404-description">
        We're sorry! An unexpected error occurred. Please try again later.
    </p>

    <a href="{% url 'website:index' %}" class="error-404-button">
        Back to Home
    </a>

</div>


{% endblock %}
