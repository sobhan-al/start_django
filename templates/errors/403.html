{% extends "base.html" %}
{% load static %}

{% block content %}


<div class="error-404-page">

    <h1 class="error-404-title">
        Sorry! You don't have permission to access this page.
    </h1>

    <img
        src="{% static 'img/errors/403.png' %}"
        alt="403 - Forbidden"
        class="error-404-image"
    >

    <p class="error-404-description">
        Oops! This page is restricted. You don't have access to it.
    </p>

    <a href="{% url 'website:index' %}" class="error-404-button">
        Back to Home
    </a>

</div>


{% endblock %}
