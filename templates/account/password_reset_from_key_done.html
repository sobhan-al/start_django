
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Lato', sans-serif;
            background: #faf7f2;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            text-align: center;
            background: #fffdf9;
            border: 1px solid #eee4d7;
            border-radius: 18px;
            box-shadow: 0 16px 45px rgba(61, 45, 31, .08);
        }

        .login-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #f5eadb;
            color: #72523b;
            font-size: 27px;
        }

        .login-title {
            margin-bottom: 14px;
            color: #292722;
            font-size: 1.6rem;
            font-weight: 600;
        }

        .login-description {
            margin-bottom: 26px;
            color: #82776d;
            font-size: .96rem;
            line-height: 1.9;
        }

        .login-button {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #72523b;
            border-radius: 10px;
            background: #72523b;
            color: white;
            text-decoration: none;
        }

        .login-button:hover {
            background: #5b402d;
            color: white;
        }

        @media (max-width: 575.98px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>
<div class="login-page">
    <div class="login-card">

        <div class="login-icon" aria-hidden="true">✓</div>

        <h1 class="login-title">Password Changed</h1>

        <p class="login-description">
            Your password has been changed successfully.
            You can now log in with your new password.
        </p>

        <a href="{% url 'account_login' %}" class="login-button">
            Continue to Login
        </a>

    </div>
</div>
</body>
</html>
