
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Lato', sans-serif;
            background: #faf7f2;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            text-align: center;
            background: #fffdf9;
            border: 1px solid #eee4d7;
            border-radius: 18px;
            box-shadow: 0 16px 45px rgba(61, 45, 31, .08);
        }

        .login-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #f5eadb;
            color: #9b6843;
            font-size: 27px;
        }

        .login-title {
            margin-bottom: 14px;
            color: #292722;
            font-size: 1.6rem;
            font-weight: 600;
        }

        .login-description {
            margin-bottom: 26px;
            color: #82776d;
            font-size: .96rem;
            line-height: 1.9;
        }

        .login-button {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #72523b;
            border-radius: 10px;
            background: #72523b;
            color: white;
            text-decoration: none;
        }

        .login-button:hover {
            background: #5b402d;
            color: white;
        }

        .login-link {
            display: inline-block;
            margin-top: 22px;
            color: #8b6243;
            font-size: .9rem;
            text-decoration: none;
        }

        .login-link:hover {
            color: #5b402d;
            text-decoration: underline;
        }

        @media (max-width: 575.98px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>
<div class="login-page">
    <div class="login-card">

        <div class="login-icon" aria-hidden="true">✉</div>

        <h1 class="login-title">Check Your Email</h1>

        <p class="login-description">
            If an account matches the information you entered,
            you may receive an email with instructions to reset
            your password. Please check your inbox and spam folder.
        </p>

        <a href="{% url 'account_login' %}" class="login-button">
            Back to Login
        </a>

        <a href="{% url 'account_reset_password' %}" class="login-link">
            Try Again
        </a>

    </div>
</div>
</body>
</html>
