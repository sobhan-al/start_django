<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Out</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            color: #222;
            background-color: #fff;
        }

        .menu {
            margin-bottom: 35px;
        }

        .menu h3 {
            margin-bottom: 12px;
        }

        .menu ul {
            padding-left: 35px;
        }

        .menu a {
            color: #0645ad;
            font-size: 17px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 25px;
        }

        .logout-form p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .logout-button {
            padding: 9px 18px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #888;
            border-radius: 4px;
            background: #f2f2f2;
        }

        .logout-button:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

    <nav class="menu">
        <h3>Menu:</h3>

        <ul>
            <li>
                <a href="{% url 'account_email' %}">Change Email</a>
            </li>
            <li>
                <a href="{% url 'account_change_password' %}">
                    Change Password
                </a>
            </li>
            <li>
                <a href="{% url 'account_logout' %}">Sign Out</a>
            </li>
        </ul>
    </nav>

    <main>
        <h1>Sign Out</h1>

        <p>Are you sure you want to sign out?</p>

        <form class="logout-form"
              method="post"
              action="{% url 'account_logout' %}">

            {% csrf_token %}

            {{ redirect_field }}

            <button class="logout-button" type="submit">
                Sign Out
            </button>
        </form>
    </main>

</body>
</html>
