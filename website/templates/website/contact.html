<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تماس با ما - فروشگاه من</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7ff;
            color: #222;
        }

        /* Navbar */
        nav {
            height: 70px;
            background: linear-gradient(90deg, #5b21b6, #2563eb);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            color: white;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        .menu a:hover {
            color: #dbeafe;
        }

        /* Contact Section */
        .contact {
            min-height: calc(100vh - 140px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .contact-box {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.15);
        }

        .contact-box h1 {
            text-align: center;
            color: #4c1d95;
            margin-bottom: 15px;
        }

        .contact-box p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #312e81;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #c7d2fe;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            border-color: #6366f1;
        }

        textarea {
            height: 130px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #5b21b6, #2563eb);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Footer */
        footer {
            height: 70px;
            background: #312e81;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mobile */
        @media (max-width: 768px) {
            nav {
                padding: 0 5%;
            }

            .menu {
                gap: 12px;
            }

            .menu a {
                font-size: 14px;
            }

            .contact-box {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>

        <div class="logo">
            🛍️ فروشگاه من
        </div>

        <ul class="menu">
            <li>
                <a href="index">خانه</a>
            </li>

            <li>
                <a href="index.html#products">محصولات</a>
            </li>

            <li>
                <a href="index.html#about">درباره ما</a>
            </li>

            <li>
                <a href="contact.html">تماس با ما</a>
            </li>
        </ul>

    </nav>


    <!-- Contact -->
    <section class="contact">

        <div class="contact-box">

            <h1>تماس با ما</h1>

            <p>
                اگر سوال یا پیشنهادی دارید، از طریق فرم زیر با ما در ارتباط باشید.
            </p>

            <form>

                <label for="name">نام</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="نام خود را وارد کنید"
                >

                <label for="email">ایمیل</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ایمیل خود را وارد کنید"
                >

                <label for="message">پیام</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="پیام خود را بنویسید..."
                ></textarea>

                <button type="submit">
                    ارسال پیام
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 تمامی حقوق برای فروشگاه من محفوظ است.</p>
    </footer>

</body>

</html>
